<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appunti</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/bundle.css">
<link rel="stylesheet" href="/notes.css">
<style>
  .bar { position: sticky; top: 0; z-index: 5; background: var(--background); border-bottom: var(--stroke-hairline) solid var(--border); }
  .bar-in { max-width: 1100px; margin: 0 auto; padding: var(--space-4) var(--space-8); display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-6); align-items: center; }
  .pick { display: flex; gap: var(--space-4); align-items: baseline; min-width: 0; flex-wrap: wrap; }
  .pick .eyebrow { color: var(--muted-foreground); margin: 0; font-size: 12px; }
  select, input { font: 500 14px/20px var(--font-sans); color: var(--foreground); background: var(--card); border: var(--stroke-hairline) solid var(--border); border-radius: 0; padding: 6px 10px; outline: none; }
  select:focus, input:focus, button:focus-visible { border-color: var(--diagram-link); outline: var(--stroke-hairline) solid var(--diagram-link); }
  select { max-width: 340px; }
  input { width: 170px; }
  .acts { display: flex; gap: var(--space-2); align-items: center; }
  button { font: 600 14px/20px var(--font-sans); border-radius: 0; padding: 8px 14px; cursor: pointer; border: var(--stroke-hairline) solid var(--border); background: transparent; color: var(--foreground); }
  button:hover:not(:disabled) { background: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  #go { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); padding: 8px 18px; }
  #go:hover:not(:disabled) { background: var(--primary); filter: brightness(1.06); }
  #go kbd { font: 500 11px var(--font-mono); opacity: .7; margin-left: 6px; }
  .status { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); min-height: 16px; display: flex; gap: var(--space-4); }
  .status .new { color: var(--foreground); }
  .status .err { color: var(--destructive); }
  .prog { height: var(--stroke-strong); background: transparent; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 30%; background: var(--primary); transform: translateX(-100%); }
  .busy .prog i { animation: run 1.3s linear infinite; }
  @keyframes run { to { transform: translateX(340%); } }
  .empty { padding: var(--space-20) 0; color: var(--muted-foreground); max-width: 560px; }
  .empty p { margin: 0 0 var(--space-4); }
  .n-sec.fresh .n-eyebrow { color: var(--diagram-link); }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="bar-in">
    <div class="pick">
      <p class="eyebrow">Appunti</p>
      <select id="file" title="Trascrizione"></select>
      <input id="course" placeholder="Corso" title="Nome del corso: aiuta DeepSeek a correggere i termini">
    </div>
    <div class="acts">
      <button id="undo" title="Rimuove l'ultima riscrittura">Annulla ultima</button>
      <button id="html" title="Apre gli appunti salvati nel browser">Apri file</button>
      <button id="go">Riscrivi appunti<kbd>⌘↩</kbd></button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="prog"><i></i></div>
</div>

<main class="n-doc">
  <header class="n-doc-head"><p class="pr-eyebrow eyebrow" id="eyebrow">Appunti</p><h1 id="title">—</h1><p class="n-meta" id="meta"></p></header>
  <div id="notes"></div>
</main>

<script src="/render.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let S = null, sel = null, working = false, err = "", lastCount = -1;

async function refresh() {
  try {
    const r = await fetch("/api/state" + (sel ? "?file=" + encodeURIComponent(sel) : ""));
    show(await r.json());
  } catch { status("Server Appunti non raggiungibile.", true); }
}

function show(s, freshFrom) {
  S = s;
  if (!sel && s.file) sel = s.file;
  const f = $("file");
  const opts = s.files.map((n) => `<option${n === s.file ? " selected" : ""}>${n.replace(/\.md$/, "").replace(/[&<>]/g, "")}</option>`).join("");
  if (f.innerHTML !== opts) f.innerHTML = opts;
  if (document.activeElement !== $("course") && !$("course").value) $("course").value = s.course || "";
  $("title").textContent = s.title || "Nessuna trascrizione";
  $("meta").textContent = s.file ? `${s.dir}/${s.file}` : `Avvia una registrazione in Lecture Scribe: le trascrizioni sono in ${s.dir}`;
  const secs = s.sections || [];
  if (secs.length !== lastCount || freshFrom != null) {
    $("notes").innerHTML = secs.length
      ? renderNotes(secs)
      : `<div class="empty"><p>Ancora nessun appunto.</p><p>Quando vuoi, premi <b>Riscrivi appunti</b>: DeepSeek trasforma in appunti le frasi trascritte dall'ultima volta.</p></div>`;
    lastCount = secs.length;
    if (freshFrom != null) {
      const first = document.getElementById("s" + (freshFrom + 1));
      document.querySelectorAll(".n-sec").forEach((el, i) => i >= freshFrom && el.classList.add("fresh"));
      if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  const pending = (s.lines || 0) - (s.done || 0);
  $("go").disabled = working || !s.file || pending <= 0 || s.busy;
  $("undo").disabled = working || !secs.length;
  $("html").disabled = !s.file;
  document.body.classList.toggle("busy", working || !!s.busy);
  if (working) return;
  if (err) return status(err, true);
  if (!s.file) return status("");
  status(
    pending > 0
      ? `<span class="new">${pending} ${pending === 1 ? "frase nuova" : "frasi nuove"}</span><span>trascritto fino a ${s.lastT}</span><span>${secs.length} sezioni</span>`
      : `<span>Appunti aggiornati a ${s.lastT || "—"}</span><span>${secs.length} sezioni</span>`
  );
}

function status(html, isErr) { $("status").innerHTML = isErr ? `<span class="err">${html.replace(/[&<>]/g, "")}</span>` : html; }

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Appunti": "1" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function rewrite() {
  if ($("go").disabled) return;
  working = true; err = "";
  const before = (S.sections || []).length;
  const pending = S.lines - S.done;
  $("go").disabled = true; $("undo").disabled = true;
  document.body.classList.add("busy");
  status(`<span class="new">DeepSeek sta scrivendo gli appunti di ${pending} ${pending === 1 ? "frase" : "frasi"}…</span>`);
  const t0 = performance.now();
  try {
    const j = await post("/api/rewrite", { file: sel, course: $("course").value });
    working = false;
    const from = j.replaced ? before - 1 : before;
    show(j, from);
    const secs = ((performance.now() - t0) / 1000).toFixed(0);
    status(`<span class="new">${j.replaced ? "Ultima sezione ampliata" : ""}${j.replaced && j.added > 1 ? " · " : ""}${j.added - (j.replaced ? 1 : 0) > 0 ? `${j.added - (j.replaced ? 1 : 0)} nuove sezioni` : ""}${!j.added ? "Niente di nuovo da annotare" : ""}</span><span>in ${secs} s · salvato</span>`);
  } catch (e) {
    working = false; err = "Errore: " + e.message; refresh();
  }
}

$("go").onclick = rewrite;
$("undo").onclick = async () => { if (!confirm("Rimuovere l'ultima riscrittura?")) return; err = ""; try { show(await post("/api/undo", { file: sel }), null); lastCount = -1; refresh(); } catch (e) { err = e.message; } };
$("html").onclick = () => post("/api/open", { file: sel, what: "html" });
$("file").onchange = () => { sel = $("file").value + ".md"; lastCount = -1; err = ""; refresh(); };
addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); rewrite(); } });
refresh();
setInterval(() => { if (!working) refresh(); }, 3000);
</script>
</body>
</html>
