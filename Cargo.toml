[package]
name = "transcribe-lecture"
version = "0.1.0"
edition = "2024"
description = "Live, on-device lecture transcription for macOS, with slides made from what was said"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "parakeet", "lecture", "macos"]
publish = false

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
transcribe-cpp = "0.4.2"
wry = "0.57.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
